name: Build offline Windows release
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Existing draft Release ID; leave empty to use the version tag'
        type: string
        required: false
      audio_seed_tag:
        description: 'Reuse verified media from this previous release; empty downloads from the public source'
        type: string
        required: false
        default: 'v1.2.0'
permissions:
  contents: write
concurrency:
  group: offline-windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Initialize complete question bank
        run: npm run setup-data
      - name: Restore media from verified previous release
        if: inputs.audio_seed_tag != ''
        continue-on-error: true
        shell: pwsh
        env:
          AUDIO_SEED_TAG: ${{ inputs.audio_seed_tag }}
        run: ./scripts/seed-release-audio.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:AUDIO_SEED_TAG
      - name: Prepare full offline audio
        run: npm run download-audio
      - name: Verify engine and media behavior
        run: npm test
      - name: Build Windows launcher and installer
        shell: pwsh
        run: |
          Copy-Item -LiteralPath (Get-Command node).Source -Destination runtime/node.exe
          ./build-launcher.ps1
          ./build-release.ps1 -ReleaseDirectory (Join-Path (Split-Path $PWD -Parent) 'output/release')
      - name: Publish verified release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          $taskArgs = @('scripts/publish-github.mjs','--repo',$env:GITHUB_REPOSITORY,'--release-dir',(Join-Path (Split-Path $PWD -Parent) 'output/release'))
          if ($env:RELEASE_ID) { $taskArgs += @('--release-id',$env:RELEASE_ID) }
          node @taskArgs
